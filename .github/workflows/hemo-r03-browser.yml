name: HEMO R03 live browser
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  live-browser:
    name: Current Angular browser with real SQL HTTP API
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sholehamed/hemo-frontend-asd
          ref: d513ef5d2ae5851f1bf421f0b88ca5faa8926614
          path: hemo-browser-frontend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: hemo-browser-frontend/.node-version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build pinned current Angular application without source replacement
        working-directory: hemo-browser-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install isolated browser runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hemo-browser"
          npm install --prefix "$RUNNER_TEMP/hemo-browser" --no-save --package-lock=false playwright@1.51.1
          node "$RUNNER_TEMP/hemo-browser/node_modules/playwright/cli.js" install --with-deps chromium
          cp tests/browser/r03-live-browser.mjs "$RUNNER_TEMP/hemo-browser/"
          test -f "$GITHUB_WORKSPACE/hemo-browser-frontend/dist/sakai-ng/browser/index.html"
          echo "HEMO_BROWSER_DIST=$GITHUB_WORKSPACE/hemo-browser-frontend/dist/sakai-ng/browser" >> "$GITHUB_ENV"
          echo "HEMO_BROWSER_SCRIPT=$RUNNER_TEMP/hemo-browser/r03-live-browser.mjs" >> "$GITHUB_ENV"
      - name: Start isolated SQL Server on loopback
        shell: bash
        run: |
          set -euo pipefail
          password="Hemo!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --rm --name hemo-browser-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec hemo-browser-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "HEMO_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Run continuous real HTTP and browser acceptance
        run: dotnet test tests/Hemo.Admission.Tests -c Release --filter "FullyQualifiedName~IsolatedHttpAcceptanceTests" --logger "console;verbosity=normal"
      - if: always()
        run: docker rm -f hemo-browser-sql || true
