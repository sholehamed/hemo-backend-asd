name: HEMO admission CI
on:
  push:
    branches: [feature/st-01-st-02-admission, feature/st-03-blood-requests, feature/st-04-blood-bank, feature/st-05-transfusion, feature/st-06-hemovigilance, feature/st-07-quality-management, feature/st-08-delivery, feature/st-09-dashboards]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build web/web.csproj -c Release
      - run: dotnet test tests/Hemo.Admission.Tests -c Release --filter "Category!=SqlServer"
      - name: Start isolated SQL Server
        shell: bash
        run: |
          password="Hemo!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --rm --name hemo-ci-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec hemo-ci-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "HEMO_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: dotnet test tests/Hemo.Admission.Tests -c Release --filter "Category=SqlServer"
      - if: always()
        run: docker rm -f hemo-ci-sql || true
