      - AdminIssuerSigningKey=ctX0Rpzf9i48i10StuElk0X6nghvc5LHwCJowobd1J0ucUb3p80n5VoDo2L0twAGzg1stDPW8nfgBhDeTg0gXutUMfDNEshHR0uG0mKkKuwrVC2kfEH0Jz7mBrwSnu4s
      - DataBaseServer=database
      - DataBasePort=5432
      - DataBaseUsername=postgres
      - DataBasePassword=4jtwjRA88yCNuFJGhJk0iFLm83naI2LmJdx5RDvttNtZSYhaSs
      - DbType=1
      - Audience=456808262525-egn6as75d6poe9mvcj9s9csao2jb0m6l.apps.googleusercontent.com
